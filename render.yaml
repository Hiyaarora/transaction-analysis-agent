# One Render web service: the FastAPI process serves /api/* and, from the same
# origin, the React production build. One URL, no CORS, one place for the API
# key - it stays in this process and never reaches the browser.
#
# The Python version is pinned in .python-version, not here, so a local pyenv
# and the deploy agree on one number.

services:
  - type: web
    name: transaction-analysis-agent
    runtime: python
    plan: free
    region: oregon

    # Node is available in Render's Python runtime, so the UI is built from the
    # deployed commit rather than committed as build output. Order matters only
    # in that both must finish before the service starts.
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build

    # One process, one worker: sessions live in this process's memory.
    startCommand: python run_api.py

    # Cheap, needs no session header, and never calls the provider.
    healthCheckPath: /api/health

    envVars:
      - key: LLM_PROVIDER
        value: groq

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # Set in the Render dashboard, never in the repository. `sync: false`
      # is what tells Render not to expect a value here.
      - key: GROQ_API_KEY
        sync: false

      # Asked only when Groq cannot answer at all - out of quota for the day,
      # or unreachable. Each provider already retries within itself; this is
      # the escape from the provider as a whole being unavailable.
      - key: LLM_FALLBACK_PROVIDER
        value: gemini

      # The second secret, on the same terms as the first: prompted for, never
      # committed. A fallback that cannot be built is skipped rather than
      # fatal, so leaving this empty degrades to Groq alone instead of taking
      # the service down - but then there is no fallback.
      - key: GEMINI_API_KEY
        sync: false

      # Python writes .pyc files the container will never reuse.
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

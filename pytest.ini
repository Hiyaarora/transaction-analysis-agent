[pytest]
testpaths = tests
addopts = -q

# Warnings are errors: a warning from our own code is a defect. The one
# exception is a deprecation inside anyio, reached through Starlette's test
# client, which we cannot fix from here.
filterwarnings =
    error
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
